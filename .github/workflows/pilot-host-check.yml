name: Пилот — проверка публичной PNG-ссылки

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pilot-host-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Создать тестовое PNG (не для Ozon)
        run: python scripts/generate_host_check.py
      - name: Опубликовать тестовый файл
        run: |
          git config user.name "soyuz-music-bot"
          git config user.email "actions@users.noreply.github.com"
          git add photocards/pilot-host-check.png
          if ! git diff --cached --quiet; then
            git commit -m "Add PNG for HTTPS pilot check (not Ozon content)"
            git push
          fi
      - name: Проверить публичную HTTPS-ссылку без авторизации
        run: |
          python - <<'PY'
          import time, urllib.request
          url='https://raw.githubusercontent.com/soyuz-music-shop/soyuz-music-photocards/main/photocards/pilot-host-check.png'
          for attempt in range(8):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'SOYUZ-PhotoCards-HTTPS-Pilot'})
                  with urllib.request.urlopen(req,timeout=20) as response:
                      head=response.read(24)
                      assert response.status==200 and head[:8]==b'\x89PNG\r\n\x1a\n'
                      assert head[16:24]==(1200).to_bytes(4,'big')+(1600).to_bytes(4,'big')
                      print('PUBLIC_PNG_HTTPS_OK: 200 PNG 1200x1600')
                      break
              except Exception as exc:
                  if attempt==7: raise
                  time.sleep(3)
          PY
