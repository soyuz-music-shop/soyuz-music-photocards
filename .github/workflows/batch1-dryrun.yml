name: Сухая проверка 4 российских CD без изменений Ozon

on:
  push:
    paths:
      - ".github/workflows/batch1-dryrun.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pillow
        run: python -m pip install --quiet Pillow
      - name: Проверка четырёх карточек и их изображений — только чтение
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python -m py_compile scripts/batch1_russian_cd.py scripts/batch1_preflight_dryrun.py
          python scripts/batch1_preflight_dryrun.py
