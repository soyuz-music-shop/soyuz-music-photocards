name: Пилот — проверить содержимое двух фото после Ozon

on:
  push:
    paths:
      - ".github/workflows/verify-pilot-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pillow
        run: python -m pip install --quiet Pillow
      - name: Проверка фотографий Ozon (только чтение)
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: python scripts/verify_pilot_images.py
