name: Stage 2 — пробный отбор импортных CD и винила (только чтение)

on:
  push:
    paths:
      - ".github/workflows/stage2-readonly.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage2-readonly-selection
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pillow
        run: python -m pip install --quiet Pillow
      - name: Проверить восемь товаров без изменения Ozon
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
        run: |
          python -m py_compile scripts/stage2_select.py
          python scripts/stage2_select.py
      - name: Сохранить план в отдельном репозитории
        run: |
          git config user.name soyuz-music-bot
          git config user.email actions@users.noreply.github.com
          git add stage2/read-only-selection.json
          if ! git diff --cached --quiet; then
            git commit -m "Stage2: save read-only imported media selection"
            git pull --rebase origin main
            git push origin main
          fi
